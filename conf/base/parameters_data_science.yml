# Paramètres des modèles (séance C, C2) : une branche par configuration.
# Le préfixe (baseline, candidate) est le namespace du pipeline : Kedro le
# retrouve tout seul (`params:model_options` devient `params:baseline.model_options`).
# Le code des nodes ne contient aucune de ces valeurs.

baseline:
  model_options:
    test_size: 0.2
    random_state: 42
    features:
      - passenger_capacity
      - company_rating
      - review_scores_rating

candidate:
  model_options:
    test_size: 0.2
    random_state: 42
    features:
      - passenger_capacity
