[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "atelier_spaceflights"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro==1.7.0",
    "kedro-datasets[json-jsondataset,pandas-csvdataset,pandas-exceldataset,pandas-parquetdataset,pickle-pickledataset]==9.6.0",
    "scikit-learn>=1.5,<2",
]

[project.scripts]
atelier-spaceflights = "atelier_spaceflights.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "kedro-viz>=12.5.0",
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]

[tool.setuptools.dynamic.version]
attr = "atelier_spaceflights.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "atelier_spaceflights"
project_name = "atelier-spaceflights"
kedro_init_version = "1.7.0"
tools = "['Testing', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/atelier_spaceflights -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
